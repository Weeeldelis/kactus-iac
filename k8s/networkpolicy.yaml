# Seuls les Pods WordPress peuvent joindre MySQL, et uniquement sur 3306
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-depuis-wordpress-uniquement
  namespace: kactus-tb
spec:
  podSelector:
    matchLabels:
      app: mysql          # la regle protege les Pods MySQL
  policyTypes: [Ingress]  # elle filtre le trafic ENTRANT
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wordpress   # seule source autorisee
      ports:
        - port: 3306
