apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kactus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Weeeldelis/kactus-iac.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: kactus-tb
  syncPolicy:
    automated:
      selfHeal: false   # exigence de la DSI : pas d'auto-correction
      prune: false
