name: build-image
on:
  push:
    branches: [main]
    paths: ['app/**']        # ne se declenche que si l'application change
  workflow_dispatch:          # bouton pour le lancer a la main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire la version
        run: echo "VERSION=$(cat app/VERSION)" >> $GITHUB_ENV
      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: app
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: kakctus/kactus-web:${{ env.VERSION }}
